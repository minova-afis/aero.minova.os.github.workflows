name: Java Continuous Integration

on:
  workflow_call:
    inputs:
      dependency-check-auto-update:
        description: 'If true, OWASP Dependency Check retrieves current NVD data which usually takes more than 2 minutes. Otherwise use NVD data retrieved at midnight every day.'
        type: boolean
        default: false
      dependency-check-goal:
        description: 'OWASP Dependency Check command to be executed, e.g. check, aggregate'
        type: string
        default: 'check'
      do-containerize:
        description: 'Should CI flow create a container image?'
        type: boolean
        default: false
      do-sonar-scan:
        description: 'Should CI flow run a SonarQube scan?'
        type: boolean
        default: false
      maven-goal:
        description: 'Maven goal during the build, e.g. verify, package, install'
        type: string
        default: 'verify'
      registry:
        description: 'Container registry to be used, e.g. ghcr.io, docker.io'
        type: string
        default: 'ghcr.io'
      java-version:
        type: string
        default: '21'
    outputs:
      container-image:
        description: 'Fully qualified name of the prepared container image'
        value: ${{ jobs.build.outputs.container-image }}

jobs:
  build:
    name: build, analyze, containerize
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[maven-release-plugin]')"
    outputs:
      container-image: ${{ steps.maven-version.outputs.container-image }}
    permissions:
      contents: read

    steps:
      - name: get branch name
        id: branch-name
        uses: tj-actions/branch-names@v9

      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          java-package: jdk
          cache: maven

      - name: cache SonarQube packages
        if: inputs.do-sonar-scan
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: retrieving NVD database (ghcr.io)
        if: ${{ !inputs.dependency-check-auto-update && github.actor != 'dependabot[bot]' }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -euo pipefail
            printf '%s' "$GHCR_PASSWORD" |
              docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            id=$(docker create ghcr.io/minova-afis/dependency-check-action:latest)
            mkdir -p ~/.m2/repository/org/owasp/dependency-check-data
            docker cp "$id:/usr/share/dependency-check/data" ~/.m2/repository/org/owasp/dependency-check-data/7.0
            docker cp "$id:/usr/share/dependency-check/data" ~/.m2/repository/org/owasp/dependency-check-data/9.0
            docker rm -v "$id"
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}

      - name: Maven build (for dependabot)
        if: github.actor == 'dependabot[bot]'
        run: |
          mvn --batch-mode \
            -P repo-github -P all-tests \
            ${{ inputs.maven-goal }} \
            -Dusername=$GITHUB_ACCESS_TOKEN \
            -DAWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            -DAWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --file pom.xml \
            --settings .github/settings.xml
        env:
          MAIN_GITHUB_RELEASE_USERNAME: ${{ secrets.MAIN_GITHUB_RELEASE_USERNAME }}
          MAIN_GITHUB_RELEASE_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}

      - name: Maven build (including OWASP Dependency Check)
        if: github.actor != 'dependabot[bot]'
        run: |
          mvn --batch-mode \
            -P repo-github -P all-tests \
            ${{ inputs.maven-goal }} \
            org.owasp:dependency-check-maven:${{ inputs.dependency-check-goal }} \
            -DautoUpdate=${{ inputs.dependency-check-auto-update }} \
            -Dusername=$GITHUB_ACCESS_TOKEN \
            -DAWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            -DAWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --file pom.xml \
            --settings .github/settings.xml
        env:
          MAIN_GITHUB_RELEASE_USERNAME: ${{ secrets.MAIN_GITHUB_RELEASE_USERNAME }}
          MAIN_GITHUB_RELEASE_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}

      - name: set up JDK 21 for Sonar Scan
        if: inputs.do-sonar-scan && inputs.java-version != '21'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk

      - name: SonarQube scan
        if: inputs.do-sonar-scan
        run: |
          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} \
            -Dsonar.branch.name=${{ steps.branch-name.outputs.current_branch }} \
            --file pom.xml \
            --settings .github/settings.xml
        env:
          MAIN_GITHUB_RELEASE_USERNAME: ${{ secrets.MAIN_GITHUB_RELEASE_USERNAME }}
          MAIN_GITHUB_RELEASE_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}

      - name: store report of Dependency Check
        if: github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report.html
          path: target/dependency-check-report.html

      - name: read Maven version
        if: inputs.do-containerize
        id: maven-version
        shell: bash
        run: |
          VERSION=$(mvn --batch-mode -q \
            -P repo-github \
            --file pom.xml \
            --settings .github/settings.xml \
            help:evaluate \
            -Dexpression=project.version \
            -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "container-image=${{ inputs.registry }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:$VERSION" >> "$GITHUB_OUTPUT"
        env:
          MAIN_GITHUB_RELEASE_USERNAME: ${{ secrets.MAIN_GITHUB_RELEASE_USERNAME }}
          MAIN_GITHUB_RELEASE_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.MAIN_GITHUB_RELEASE_TOKEN }}

      - name: build & push container image '${{ steps.maven-version.outputs.container-image }}'
        if: inputs.do-containerize && steps.branch-name.outputs.ref_branch == 'main' && github.event_name != 'pull_request'
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: ${{ github.event.repository.name }}
          tags: ${{ steps.maven-version.outputs.version }},latest
          dockerfile: ./Dockerfile
          registry: ${{ inputs.registry }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}
